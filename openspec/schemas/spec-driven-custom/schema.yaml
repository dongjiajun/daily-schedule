name: spec-driven-custom
version: 1
description: 日程管理系统定制工作流 — 契约驱动 + DDD 四层 + 前后端分离
artifacts:
  - id: proposal
    generates: proposal.md
    description: 提案文档，阐明变更动机与影响范围
    template: proposal.md
    instruction: |
      创建 proposal，阐明此变更的动机与范围。
      **格式纪律（MUST）**：撰写前先读取模板 `templates/proposal.md`，严格按其章节结构与格式撰写（含 Capabilities 的子标题格式），不得自创章节结构。

      本项目是日程管理系统，采用 DDD 四层架构（API→应用→领域←基础设施）+ React 19 前端。
      API 契约驱动：specs/openapi.yaml 是唯一真相源。

      必填章节：
      - **Why**: 问题/机会（1-2 句）
      - **What Changes**: 变更清单，标记 **BREAKING**
      - **Capabilities**:
        - New: kebab-case 名称 + 简述（每个将生成 specs/<name>/spec.md）
        - Modified: 仅在需求级变更时列出现有 capability 名称
      - **API Contract Impact**: 是否需要改 specs/openapi.yaml？新增/修改哪些端点？
      - **DDD Layer Impact**: 标注受影响的层（API / 应用 / 领域 / 基础设施）
      - **Database Impact**: 是否需要新 Flyway 迁移？涉及哪些表/列？
      - **Impact**: 受影响的代码、前端组件、依赖

      保持 1-2 页，聚焦 "why" 而非 "how"。

      skip_specs（无行为变化时）：纯重构/工具链/文档/热修等无 spec 级行为变化的变更，必须在 .openspec.yaml 设 `skip_specs: true`，不得绕过 OpenSpec 流程；`openspec validate` 放行零 delta + skip_specs 的变更。行为变化的变更必须提供 delta specs，不得用 skip_specs 逃避。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 详细规格，定义系统行为
    template: spec.md
    instruction: |
      为 proposal 中每个 capability 创建一份 spec 文件。
      **格式纪律（MUST）**：撰写前先读取模板 `templates/spec.md`，delta 操作块（ADDED/MODIFIED/REMOVED Requirements）的格式严格按模板与指令规定执行。

      本项目规格要点：
      - API 端点变更必须引用 OpenAPI schema（字段名、类型、必填/可选）
      - 数据库变更必须列明表名、列名、类型、约束、默认值、索引
      - 前端行为规格应涵盖状态管理（Zustand store / React Query cache）、UI 交互、错误处理

      Delta 操作（## 标题）：
      - **ADDED Requirements**: 新增能力
      - **MODIFIED Requirements**: 变更行为 — 必须包含完整内容（非片段）
      - **REMOVED Requirements**: 废弃 — 必须含 **Reason** + **Migration**
      - **RENAMED Requirements**: 仅改名 — 用 FROM:/TO: 格式

      Purpose（官方 1.15.0 规范）：
      - **新能力**：delta 必须以 `## Purpose` 段开头，1-2 句描述用途，内容 ≥50 字符（`openspec validate --strict` 对过短报 WARNING）；归档/同步时由此种子新主 spec 的 Purpose
      - **已存在能力**：delta 不得携带 `## Purpose` 段（主 spec 已有，delta 的会被忽略）；修改已有 Purpose 直接编辑 openspec/specs/<cap>/spec.md
      - REMOVED 删掉某能力最后一个 requirement 时，归档需在 .openspec.yaml 声明 `retire_capabilities: true`（否则归档中止）

      格式规范：
      - 每条需求: `### Requirement: <名称>` + 描述（用 SHALL/MUST）
      - 每个场景: `#### Scenario: <名称>` + WHEN/THEN（严格 4 个 #）
      - 每条需求至少 1 个正常路径（happy-path）场景 + 1 个失败/边界（failure/edge）场景；确无边界场景时须在场景正文说明理由
      - 每条需求正文 ≤500 字符（官方 1.14.1+ strict 规则：超长报 WARNING → `validate --strict` 失败）；细节/示例/枚举移入 scenarios，或拆分为多条需求
      - delta specs 不得携带 Test Coverage 段（官方 1.14.2 起 strict 对 delta 中额外的 `##` 段报错；该表仅用于回填主 spec 的历史审计）
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 技术设计文档，阐明实现方案
    template: design.md
    instruction: |
      创建设计文档，阐明如何实现变更。仅在以下情况需要：
      - 跨模块变更 / 新架构模式 / 外部依赖 / 安全/性能/迁移复杂度
      **格式纪律（MUST）**：撰写前先读取模板 `templates/design.md`，Decision 采用 `### Decision N: <名称>` 编号 + 三段式（**选择**/**理由**/**备选方案**），章节结构按模板。

      本项目设计要点：
      - **DDD 分层方案**: 明确变动涉及的后端包路径
        (api/controller, application, domain, infrastructure)
      - **API 设计**: 引用 OpenAPI schema 路径与字段，注明限流/分页/错误码
      - **数据库设计**: 表名/列名/类型/约束/索引/迁移脚本名
      - **前端设计**: 组件树 (components/*)、状态管理 (Zustand store / React Query)、路由
      - **安全考量**: 认证 (JWT/Cookie)、授权、数据隔离 (user_id)

      章节：
      - **Context**: 背景、当前状态、约束
      - **Goals / Non-Goals**
      - **Decisions**: 每个技术决策含选型理由 + 被否决的备选方案
      - **DDD Layer Design**: 按四层逐一说明变更方案（领域层/基础设施层/应用层/API 层）
      - **API Design**: 引用 OpenAPI schema 路径与字段，注明请求/响应/错误码
      - **Database Design**: 表名/列名/类型/约束/索引/迁移脚本名
      - **Risks / Trade-offs**: [风险] → 缓解措施
      - **Migration Plan**: 部署步骤、回滚策略
      - **Open Questions**

      模板含 `## Review Checklist`（失败路径/回滚/契约影响三问），写完须逐项回答。

      重点在架构与方案，非逐行实现。
    requires:
      - proposal

  - id: test-plan
    generates: test-plan.md
    description: 测试计划 — 场景到命名测试/等价机械验证的映射活账本
    template: test-plan.md
    instruction: |
      创建测试计划，将 delta specs 中每个 `#### Scenario:` 逐条映射为可执行验证项。
      **格式纪律（MUST）**：撰写前先读取模板 `templates/test-plan.md`，按双模式填写；表头固定 6 列：
      `Requirement | Scenario | Test File / 验证项 | Test Name / 验证命令 | Initial State | Coverage Notes`。
      前两列（Requirement / Scenario）不可改名——CI 解析器只读取前两列。

      按变更是否有独立测试面选择模式（全表统一；确需混合时在 Coverage Notes 标明所属模式）：
      - **模式 A（有独立测试面）**：沿用现有 6 列账本，将 delta 每个场景映射到命名测试（测试文件 + 测试类/方法名），红绿翻转
      - **模式 B（无测试面）**：工具链/文档/配置/纯 CI 脚本变更，把每个 delta 场景映射到等价机械验证项——填写验证命令或 CI 检查名（如 `node scripts/openspec-check.mjs --self-test`），仍需逐场景一行

      纪律：
      - 每个 delta 场景必须有对应行（Requirement/Scenario 引用一致），无遗漏
      - 未实现场景 Initial State 记 `🔴`；实现并通过验证后改写 `🟢`
      - 模式 B 必须在 Coverage Notes 注明「等价机械验证」及理由（说明为何无独立测试面）
      - **禁止虚标测试文件**：模式 B 不得编造测试文件/测试名，以实际可执行的验证命令或 CI 检查名为准
      - **红绿纪律**：apply 时逐场景先写/改对应测试（或验证项）确认失败（红），再实现至通过（绿），账本行同步翻转
      - **漂移停流**：spec 变化（需求变更）时停止实施 → 更新 delta spec → 重审 → 更新本表 → 继续
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: 实现任务清单，可追踪的 checkbox 格式
    template: tasks.md
    instruction: |
      拆分实现任务，按本项目 DDD 分层顺序排列：
      **格式纪律（MUST）**：撰写前先读取模板 `templates/tasks.md`，保持 1-9 固定分组编号（数据库迁移→领域层→基础设施→应用→API→契约同步→前端→文档同步→全量验证），无变更的分组标记 N/A 打勾，不得自创分组编号。

      **推荐编排**: 数据库迁移 → 领域层 → 基础设施层 → 应用层 → API 层 → 前端 → 文档同步 → 全量验证
      - 涉及 API 契约变更时，确保 "重新生成 SDK" 作为独立任务
      - 各层组内自带对应测试（领域层含单元测试），不把测试堆到最后组；第 9 组只做集成/全量验证
      - 前端任务包含 SDK 重新生成、组件开发、状态管理、样式，以及 vitest 单元测试（store/hooks/组件）和 Playwright E2E 测试（`e2e/*.spec.ts`）
      - 涉及 Canvas/WASM/Web API 等 mock 无法覆盖的技术时，必须在全量验证中加 smoke test（浏览器手工验证）

      **归档前验证门禁**：真实代码变更（触碰 backend/、frontend/src/、apps/miniprogram/、packages/ 源码）须执行 `/opsx:verify` 且报告无 CRITICAL；纯工具链/文档/元数据变更在第 9 组（全量验证）注明等效依据（全量验证组套件 + validate --archived 全绿）。

      格式：
      - 每个任务: `- [ ] X.Y 任务描述`
      - 分组在 `## N. 分组名` 下
      - 任务粒度：一次会话内可完成
      - 按依赖排序
      - 第 9 组之后为 `## Workflow follow-up` 纯 bullet（非 checkbox，不参与 apply 进度统计）

      示例分组：
      ```
      ## 1. 数据库迁移
      <!-- 如有新 Flyway 脚本 -->
      - [ ] 1.1 编写 V<!-- 版本号 -->__<!-- 描述 -->.sql
      - [ ] 1.2 更新 H2 测试 schema（如新增表）
      - [ ] 1.3 启动 local MySQL 验证 Flyway 迁移成功

      ## 2. 领域层 (domain/)
      - [ ] 2.1 <!-- Entity / Enum / ValueObject / Repository 接口 / DomainService -->
      - [ ] 2.2 编写领域层单元测试

      ## 3. 基础设施层 (infrastructure/)
      - [ ] 3.1 <!-- persistence: PO + Mapper + RepositoryImpl -->
      - [ ] 3.2 <!-- security / notification / scheduled / config（按需） -->
      - [ ] 3.3 编写 infrastructure 层单元测试

      ## 4. 应用层 (application/)
      - [ ] 4.1 <!-- ApplicationService 用例编排 -->
      - [ ] 4.2 编写应用层单元测试

      ## 5. API 层 (api/)
      - [ ] 5.1 <!-- Controller 实现 generated 接口 -->
      - [ ] 5.2 <!-- Assembler DTO↔Domain 转换 -->
      - [ ] 5.3 编写 API 层单元测试

      ## 6. 契约同步
      - [ ] 6.1 更新 specs/openapi.yaml
      - [ ] 6.2 更新 specs/CHANGELOG.md
      - [ ] 6.3 同步版本号: pom.xml + package.json + openapi.yaml
      - [ ] 6.4 重新生成后端接口 (mvn compile)
      - [ ] 6.5 重新生成前端 SDK (npm run generate:api)

      ## 7. 前端 (frontend/src/)
      - [ ] 7.1 <!-- Zustand store / React Query hooks -->
      - [ ] 7.2 <!-- 组件开发 (components/) -->
      - [ ] 7.3 <!-- 页面集成 (pages/) -->
      - [ ] 7.4 <!-- 样式与动画 -->
      - [ ] 7.5 编写/更新 vitest 单元测试（store 单测 + hooks 单测 + 组件渲染测试）
      - [ ] 7.6 编写/更新 Playwright E2E 测试（`e2e/*.spec.ts`，覆盖关键用户流程）
      - [ ] 7.7 运行 `npm run test:e2e` 确认 E2E 全部通过

      ## 8. 文档同步
      <!-- 逐项评估：未触及的文档类别也必须写明"现有描述已核对仍准确"，不得仅以"无新增"标记 N/A -->
      - [ ] 8.1 `docs/frontend/component-catalog.md` — 涉及组件/目录（新增**或修改**）？→ 更新；未触及 → 核对结论
      - [ ] 8.2 `docs/database/schema.md` + `docs/uml/README.md` — 涉及表/字段/领域模型（新增**或修改**）？→ 更新；未触及 → 核对结论
      - [ ] 8.3 `docs/api/overview.md` — 涉及端点/契约（新增**或修改**）？→ 更新；未触及 → 核对结论
      - [ ] 8.4 `docs/architecture.md` + `AGENTS.md` — 涉及架构/模块/版本/测试规模？→ 更新；未触及 → 核对结论
      - [ ] 8.5 `README.md` — 涉及版本/功能清单？→ 更新；未触及 → 核对结论
      - [ ] 8.6 运行 `node scripts/docs-check.mjs` — 文档一致性检查通过

      ## 9. 全量验证
      - [ ] 9.1 `cd backend && mvn test` — 后端单元测试全部通过
      - [ ] 9.2 `cd frontend && pnpm run verify` — 前端 lint + tsc + build + vitest 全部通过
      - [ ] 9.3 `cd frontend && npm run test:e2e` — Playwright E2E 全部通过
      - [ ] 9.4 Smoke test — 启动前后端，浏览器手工验证 mock 无法覆盖的场景
        <!-- 删除下方示例行，逐项替换为本次变更实际影响的用户流程；
             无 UI 影响的变更（纯后端/纯文档）删除全部示例行后直接勾选 9.4 -->
        - [ ] 登录 → 创建日程 → 日历视图显示
        - [ ] 点击宠物 → 互动菜单弹出 → 喂食成功
        - [ ] 切换日/周/月视图 → 日程正确显示
        - [ ] 如有 mock 边界风险（Canvas/WASM/SDK），必须在此验证

      ## Workflow follow-up
      <!-- 纯 bullet，不是 checkbox 任务：不参与 apply 进度统计，归档前按序执行并留痕 -->
      - `/opsx:verify` — 代码变更必备（真实代码变更须报告无 CRITICAL；纯工具链/文档变更按第 9 组等效依据说明）
      - `/opsx:archive` — 归档（确认 delta specs 已同步、无残留 🔴）
      - 归档后复跑门禁：`pnpm run openspec:check` + `openspec validate --archived`
      ```
    requires:
      - specs
      - design
      - test-plan

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    执行 tasks.md 全部 checkbox。apply 纪律（顺序勾选 / 阻塞暂停 / 遵循 AGENTS.md 技术约定 / 归档前 verify）
    的唯一来源是 `openspec/config.yaml` 的 `operations.apply.guidance`（`openspec instructions apply` 以 Operation Guidance 透传）。

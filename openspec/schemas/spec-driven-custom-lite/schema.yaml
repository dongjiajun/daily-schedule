name: spec-driven-custom-lite
version: 1
description: 日程管理系统轻量工作流 — proposal → specs → tasks（无 design 工件），供小规模变更
artifacts:
  - id: proposal
    generates: proposal.md
    description: 提案文档，阐明变更动机与影响范围
    template: proposal.md
    instruction: |
      创建 proposal，阐明此变更的动机与范围。
      **格式纪律（MUST）**：撰写前先读取模板 `templates/proposal.md`，严格按其章节结构与格式撰写（含 Capabilities 的子标题格式），不得自创章节结构。

      本项目是日程管理系统，采用 DDD 四层架构（API→应用→领域←基础设施）+ React 19 前端。
      API 契约驱动：specs/openapi.yaml 是唯一真相源。

      必填章节：
      - **Why**: 问题/机会（1-2 句）
      - **What Changes**: 变更清单，标记 **BREAKING**
      - **Capabilities**:
        - New: kebab-case 名称 + 简述（每个将生成 specs/<name>/spec.md）
        - Modified: 仅在需求级变更时列出现有 capability 名称
      - **API Contract Impact**: 是否需要改 specs/openapi.yaml？新增/修改哪些端点？
      - **DDD Layer Impact**: 标注受影响的层（API / 应用 / 领域 / 基础设施）
      - **Database Impact**: 是否需要新 Flyway 迁移？涉及哪些表/列？
      - **Impact**: 受影响的代码、前端组件、依赖

      保持 1-2 页，聚焦 "why" 而非 "how"。

      skip_specs（无行为变化时）：纯重构/工具链/文档/热修等无 spec 级行为变化的变更，必须在 .openspec.yaml 设 `skip_specs: true`，不得绕过 OpenSpec 流程；`openspec validate` 放行零 delta + skip_specs 的变更。行为变化的变更必须提供 delta specs，不得用 skip_specs 逃避。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 详细规格，定义系统行为
    template: spec.md
    instruction: |
      为 proposal 中每个 capability 创建一份 spec 文件。
      **格式纪律（MUST）**：撰写前先读取模板 `templates/spec.md`，delta 操作块（ADDED/MODIFIED/REMOVED Requirements）的格式严格按模板与指令规定执行。

      本项目规格要点：
      - API 端点变更必须引用 OpenAPI schema（字段名、类型、必填/可选）
      - 数据库变更必须列明表名、列名、类型、约束、默认值、索引
      - 前端行为规格应涵盖状态管理（Zustand store / React Query cache）、UI 交互、错误处理

      Delta 操作（## 标题）：
      - **ADDED Requirements**: 新增能力
      - **MODIFIED Requirements**: 变更行为 — 必须包含完整内容（非片段）
      - **REMOVED Requirements**: 废弃 — 必须含 **Reason** + **Migration**
      - **RENAMED Requirements**: 仅改名 — 用 FROM:/TO: 格式

      Purpose（官方 1.15.0 规范）：
      - **新能力**：delta 必须以 `## Purpose` 段开头，1-2 句描述用途，内容 ≥50 字符（`openspec validate --strict` 对过短报 WARNING）；归档/同步时由此种子新主 spec 的 Purpose
      - **已存在能力**：delta 不得携带 `## Purpose` 段（主 spec 已有，delta 的会被忽略）；修改已有 Purpose 直接编辑 openspec/specs/<cap>/spec.md
      - REMOVED 删掉某能力最后一个 requirement 时，归档需在 .openspec.yaml 声明 `retire_capabilities: true`（否则归档中止）

      格式规范：
      - 每条需求: `### Requirement: <名称>` + 描述（用 SHALL/MUST）
      - 每个场景: `#### Scenario: <名称>` + WHEN/THEN（严格 4 个 #）
      - 每条需求至少 1 个正常路径（happy-path）场景 + 1 个失败/边界（failure/edge）场景；确无边界场景时须在场景正文说明理由
      - 每条需求正文 ≤500 字符（官方 1.14.1+ strict 规则：超长报 WARNING → `validate --strict` 失败）；细节/示例/枚举移入 scenarios，或拆分为多条需求
      - delta specs 不得携带 Test Coverage 段（官方 1.14.2 起 strict 对 delta 中额外的 `##` 段报错；该表仅用于回填主 spec 的历史审计）

      **lite 提示**：本 schema 无 design 工件——技术决策（如适用）请并入 proposal 的 What Changes/Impact 或 tasks 的实施条目；若变更需要架构级决策记录，请改用 `spec-driven-custom-standard`（需要红绿测试账本则用 `spec-driven-custom`）。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 实现任务清单，可追踪的 checkbox 格式
    template: tasks.md
    instruction: |
      拆分实现任务（LITE 轻量编排，1/2/3 三组）：
      **格式纪律（MUST）**：撰写前先读取模板 `templates/tasks.md`，保持 1/2/3 固定分组编号（实施 → 文档同步 → 全量验证），无变更的分组按模板注释处置，不得自创分组编号。

      编排要点：
      - **1. 实施**：按文件/模块列出本次改动（含对应测试），粒度一次会话可完成，按依赖排序
      - **2. 文档同步**：逐项评估每类文档（component-catalog / schema+uml / api overview / architecture+AGENTS.md / README）——涉则更新，未触及须写明"现有描述已核对仍准确"，不得仅以"无新增"标记 N/A；阶段末必须含 docs-check（+sync-version）验证条目；CI/工具链类变更同时包含 `pnpm run openspec:check`。文档同步保持在验证之前
      - **3. 全量验证**：按变更面取用（前端 `pnpm run verify` / 后端 `mvn test` / `openspec validate --specs --strict` / E2E 评估），不逐层铺开
      - 第 3 组后为 `## Workflow follow-up` 纯 bullet（`/opsx:verify`（代码变更必备）、`/opsx:archive`、归档后复跑门禁），不是 checkbox 任务，不参与 apply 进度统计

      **归档前验证门禁**：真实代码变更（触碰 backend/、frontend/src/、apps/miniprogram/、packages/ 源码）须执行 `/opsx:verify`（见 Workflow follow-up）且报告无 CRITICAL；纯工具链/文档/元数据变更在 3. 全量验证组注明等效依据（全量验证组套件 + validate --archived 全绿）。

      格式：每个任务 `- [ ] X.Y 描述`；分组在 `## N. 分组名` 下。
    requires:
      - proposal
      - specs

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    执行 tasks.md 全部 checkbox。apply 纪律（顺序勾选 / 阻塞暂停 / 遵循 AGENTS.md 技术约定 / 归档前 verify）
    的唯一来源是 `openspec/config.yaml` 的 `operations.apply.guidance`（`openspec instructions apply` 以 Operation Guidance 透传）。

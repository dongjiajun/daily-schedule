schema: spec-driven-custom-standard

# 仅保留项目级事实与代理无法从代码推断的硬约束；细节见 AGENTS.md 与 docs/。
# 预算由 openspec-check 第 10 检守护（context ≤20 行且 ≤1200 字符；rules ≤8 条）。
context: |
  日程管理系统 v3.5.1：Java 21 + Spring Boot 3.4（DDD 四层；MyBatis-Plus / Flyway / JWT）、
  React 19 + Vite 前端、Taro 4.2 微信小程序、@daily-schedule/shared 跨端共享包；MySQL 8.0（测试用 H2）。
  API 唯一真相源 specs/openapi.yaml（Maven 生成后端接口、openapi-ts 生成前端 SDK）。
  所有业务表含 user_id，查询必须经 CurrentUserService 按当前用户隔离。
  工作流约定（三档 schema 选择 / CI 门禁 / 文档同步 / 归档时机）见 AGENTS.md。

rules:
  proposal:
    - "必须评估 API 契约影响（specs/openapi.yaml 是否变更、是否 BREAKING）"
    - "涉及数据库变更时必须标注 Flyway 迁移版本号"
    - "必须说明所选 workflow schema 档位（lite/standard/custom）及理由"
  design:
    - "涉及认证/权限/用户数据隔离时必须说明安全影响"

# apply / archive 的操作纪律（advisory）：openspec instructions apply/archive 以 Operation Guidance 透传；
# schema 的 apply.instruction 仅保留指针，不重复本节内容。
operations:
  apply:
    guidance:
      - "按 tasks.md 顺序逐项实现并勾选；遇阻塞或需澄清时暂停，不得跳过未完成项"
      - "代码实现遵循 AGENTS.md 技术约定；代码变更在归档前必须运行 /opsx:verify 且报告无 CRITICAL"
  archive:
    guidance:
      - "归档前确认 tasks 全部勾选；custom 变更 test-plan 无残留 🔴；代码变更需 /opsx:verify 无 CRITICAL，纯工具链/文档变更可用全量验证组套件 + openspec validate --archived 等效并留痕"
      - "多人/PR 流：变更 artifacts 随代码同 PR 提交，PR 合并后在 main 执行 /opsx:archive；单人 main 流可同提交归档"
      - "归档后复跑 pnpm run openspec:check、openspec validate --archived 与 node scripts/docs-check.mjs，并在归档条目记录结论"

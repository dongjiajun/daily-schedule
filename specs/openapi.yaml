openapi: 3.0.3
info:
  title: 日程管理系统 API
  version: 3.1.0
  description: |
    v3.1 接口定义 — 前后端契约唯一真相源。

    **v3.1 变更**：
    - Event 新增 `status` 字段（PLANNED / COMPLETED / CANCELLED），支持"标记完成"。
    - `GET /events` 新增 `tagId`、`status` 过滤参数。
    - 已完成/已取消的日程不再触发提醒，也不参与时间冲突检测。

    **响应约定**：
    - 成功响应直接返回业务数据：单条返回对象，列表返回数组。
    - HTTP 状态码承载语义（200 / 201 / 204 / 400 / 401 / 403 / 404 / 409 / 500）。
    - 异常响应统一为 `ApiResponse`：`{ code, message }`。

    **认证（v3.0）**：
    - 除 `/auth/register` / `/auth/login` / `/auth/refresh` / `/sse/notifications` 外，
      所有端点要求 `Authorization: Bearer <accessToken>`。
    - `/sse/notifications` 不走 Bearer（EventSource 不支持自定义 header），
      改用登录时下发的 `dsa_sse_session` HttpOnly Cookie 鉴权。
    - 用户数据相互隔离：所有 event / category / tag 操作以当前用户为范围。

    变更历史见 `specs/CHANGELOG.md`。

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: 注册新用户（自动登录）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: dsa_sse_session=<jwt>; HttpOnly; SameSite=Lax; Path=/api/v1/sse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: 登录获取 token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: dsa_sse_session=<jwt>; HttpOnly; SameSite=Lax; Path=/api/v1/sse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: 使用 refresh token 换取新 access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 续签成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 注销当前会话（清除 SSE Cookie）
      responses:
        '204':
          description: 注销成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: dsa_sse_session=; Max-Age=0
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: currentUser
      tags: [Auth]
      summary: 获取当前登录用户信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events:
    get:
      operationId: listEvents
      tags: [Event]
      summary: 按时间范围查询日程
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: tagId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 按标签过滤（事件含有该标签即命中）
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventStatus'
          description: 按状态过滤
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 按标题、描述、地点搜索
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createEvent
      tags: [Event]
      summary: 创建日程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/{id}:
    get:
      operationId: getEventById
      tags: [Event]
      summary: 查询单个日程
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateEvent
      tags: [Event]
      summary: 更新日程
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteEvent
      tags: [Event]
      summary: 删除日程
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      operationId: listCategories
      tags: [Category]
      summary: 获取当前用户的所有分类
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCategory
      tags: [Category]
      summary: 创建分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /categories/{id}:
    put:
      operationId: updateCategory
      tags: [Category]
      summary: 更新分类
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteCategory
      tags: [Category]
      summary: 删除分类
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      operationId: listTags
      tags: [Tag]
      summary: 获取当前用户的所有标签
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTag
      tags: [Tag]
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /tags/{id}:
    put:
      operationId: updateTag
      tags: [Tag]
      summary: 更新标签
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTag
      tags: [Tag]
      summary: 删除标签
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sse/notifications:
    get:
      operationId: subscribeNotifications
      tags: [Notification]
      summary: 订阅实时通知（SSE）
      security: []
      description: |
        Server-Sent Events 长连接。**鉴权**：通过登录时下发的
        `dsa_sse_session` HttpOnly Cookie（EventSource 不支持自定义 header，
        因此不复用 Authorization Bearer）。

        服务端会推送以下命名事件：
        - `connect`：连接建立成功，data 为字符串 `"connected"`。
        - `reminder`：日程提醒，data 为 `ReminderEvent` JSON。
        - `heartbeat`：心跳保活，data 为字符串 `"ping"`。

        每条 reminder 仅推送给该 event 所属用户的连接。
      responses:
        '200':
          description: SSE 流建立成功
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登录后将 `LoginResponse.accessToken` 放入 `Authorization: Bearer <token>` 头。
        access token 默认有效期 15 分钟；过期后用 refresh token 调 `/auth/refresh` 续签。

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: 未认证或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: 资源冲突（用户名/邮箱/分类名/标签名重复）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 100
        displayName:
          type: string
          maxLength: 50

    LoginRequest:
      type: object
      required: [usernameOrEmail, password]
      properties:
        usernameOrEmail:
          type: string
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: access token 有效期（秒）
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    EventCreateRequest:
      type: object
      required: [title, startTime, endTime]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
          default: false
        location:
          type: string
        color:
          type: string
        reminderMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatus'
        categoryId:
          type: integer
          format: int64
        tagIds:
          type: array
          items:
            type: integer
            format: int64

    EventUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EventCreateRequest'

    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
        color:
          type: string
        reminderMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatus'
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        categoryColor:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventStatus:
      type: string
      description: |
        日程状态。PLANNED=计划中，COMPLETED=已完成，CANCELLED=已取消。
        创建时缺省按 PLANNED 处理（由服务端保障，不在 schema 声明 default，
        避免代码生成器把 default 套用到查询过滤参数上）。
      enum: [PLANNED, COMPLETED, CANCELLED]

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
        description:
          type: string

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
        description:
          type: string

    TagCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 30
        color:
          type: string

    TagResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string

    ReminderEvent:
      type: object
      description: SSE `reminder` 事件 data 的反序列化结构
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        startTime:
          type: string
          format: date-time
        reminderMinutes:
          type: integer

    ApiResponse:
      type: object
      description: 错误响应包装
      properties:
        code:
          type: integer
        message:
          type: string

openapi: 3.0.3
info:
  title: 日程管理系统 API
  version: 2.0.0
  description: |
    v1 接口定义 — 前后端契约唯一真相源。

    **响应约定**：
    - 成功响应直接返回业务数据：单条返回对象，列表返回数组。
    - HTTP 状态码承载语义（200 / 201 / 204 / 400 / 404 / 500）。
    - 异常响应统一为 `ApiResponse`：`{ code, message }`。

    变更历史见 `specs/CHANGELOG.md`。

servers:
  - url: /api/v1

paths:
  /events:
    get:
      operationId: listEvents
      tags: [Event]
      summary: 按时间范围查询日程
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createEvent
      tags: [Event]
      summary: 创建日程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /events/{id}:
    get:
      operationId: getEventById
      tags: [Event]
      summary: 查询单个日程
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateEvent
      tags: [Event]
      summary: 更新日程
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteEvent
      tags: [Event]
      summary: 删除日程
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      operationId: listCategories
      tags: [Category]
      summary: 获取所有分类
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      operationId: createCategory
      tags: [Category]
      summary: 创建分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /categories/{id}:
    put:
      operationId: updateCategory
      tags: [Category]
      summary: 更新分类
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategory
      tags: [Category]
      summary: 删除分类
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      operationId: listTags
      tags: [Tag]
      summary: 获取所有标签
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
    post:
      operationId: createTag
      tags: [Tag]
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tags/{id}:
    put:
      operationId: updateTag
      tags: [Tag]
      summary: 更新标签
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTag
      tags: [Tag]
      summary: 删除标签
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /sse/notifications:
    get:
      operationId: subscribeNotifications
      tags: [Notification]
      summary: 订阅实时通知（SSE）
      description: |
        Server-Sent Events 长连接，服务端会推送以下命名事件：

        - `connect`：连接建立成功，data 为字符串 `"connected"`。
        - `reminder`：日程提醒，data 为 `ReminderEvent` 的 JSON 序列化字符串。
        - `heartbeat`：心跳保活，data 为字符串 `"ping"`。

        前端应使用浏览器原生 `EventSource` 订阅，并通过 `addEventListener('reminder', handler)` 监听具体事件类型。
      responses:
        '200':
          description: SSE 流建立成功
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 事件流；reminder 事件的 data 字段结构见 `ReminderEvent`。

components:
  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    EventCreateRequest:
      type: object
      required: [title, startTime, endTime]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
          default: false
        location:
          type: string
        color:
          type: string
        reminderMinutes:
          type: integer
        categoryId:
          type: integer
          format: int64
        tagIds:
          type: array
          items:
            type: integer
            format: int64

    EventUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EventCreateRequest'

    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
        color:
          type: string
        reminderMinutes:
          type: integer
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        categoryColor:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
        description:
          type: string

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
        description:
          type: string

    TagCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 30
        color:
          type: string

    TagResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string

    ReminderEvent:
      type: object
      description: SSE `reminder` 事件的 data JSON 反序列化结构
      properties:
        id:
          type: integer
          format: int64
          description: 日程 ID
        title:
          type: string
          description: 日程标题
        startTime:
          type: string
          format: date-time
          description: 日程开始时间
        reminderMinutes:
          type: integer
          description: 提前提醒分钟数

    ApiResponse:
      type: object
      description: 统一错误响应包装
      properties:
        code:
          type: integer
        message:
          type: string

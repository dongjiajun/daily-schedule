spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 宠物状态衰减（每小时速率；调度间隔由 @Scheduled fixedRateString 读取）
pet:
  decay:
    intervalMs: 600000
    moodPerHour: 1.0
    hungerPerHour: 1.5

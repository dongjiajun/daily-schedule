spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=5m

# CORS 允许源（逗号分隔 origin patterns；prod 由 CORS_ORIGINS 环境变量注入）
cors:
  allowed-origin-patterns: http://localhost:*

# 微信小程序登录（环境变量注入，仓库不落明文；未配置时 wechat-login 返回 502）
wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}

# 可观测性：仅暴露 health 探活端点（SecurityConfig 显式放行 /actuator/health）
management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 宠物状态衰减（每小时速率；调度间隔由 @Scheduled fixedRateString 读取）
pet:
  decay:
    intervalMs: 600000
    moodPerHour: 1.0
    hungerPerHour: 1.5

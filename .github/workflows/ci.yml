name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 起 package.json 含 packageManager 时自动启用缓存；
          # 本 job 仅跑 shell 脚本且无 pnpm 步骤，禁用避免缓存检测失败
          package-manager-cache: false

      - name: Check version consistency
        run: ./scripts/sync-version.sh --check

      - name: Check docs consistency
        run: node scripts/docs-check.mjs

  backend:
    name: Backend (Maven compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        working-directory: backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @daily-schedule/shared run build

      - name: Check SDK freshness (spec → generate → diff)
        working-directory: frontend
        run: |
          pnpm run generate:api
          git diff --exit-code src/api/ || {
            echo "❌ 前端 SDK 已过期！请本地运行 pnpm run generate:api 并提交生成的文件。"
            exit 1
          }

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Type check + build
        working-directory: frontend
        run: pnpm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: daily_schedule_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @daily-schedule/shared run build

      - name: Start backend
        working-directory: backend
        run: |
          mvn spring-boot:run -Dspring-boot.run.profiles=test &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/v1/auth/me > /dev/null 2>&1 && echo "Backend ready" && break
            sleep 10
          done
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: daily_schedule_test
          DB_USER: root
          DB_PASSWORD: 123456

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: 'true'

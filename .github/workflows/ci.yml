name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        working-directory: backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend (lint + tsc + build + SDK drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check + build
        working-directory: frontend
        run: npm run build

      - name: Regenerate SDK and check drift
        working-directory: frontend
        run: |
          npm run generate:api
          if ! git diff --exit-code -- src/api; then
            echo "::error::Generated SDK is out of date. Run \`npm run generate:api\` and commit the result." >&2
            exit 1
          fi

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日程管理系统</title>
  </head>
  <body>
    <script>
      // 在 React 渲染前同步设置 data-theme，消除页面闪烁 (FOUC)
      (function(){try{var s=localStorage.getItem('settings.v1');if(s){var p=JSON.parse(s);if(p.state&&p.state.theme){document.documentElement.dataset.theme=p.state.theme}}}catch(e){}})()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
